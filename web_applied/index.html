<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>キーボードで動かす</title>
    <style>
      .stage {
        position: relative;
        width: 600px;
        height: 240px;
        margin: 24px auto;
        border: 2px solid #333;
        background: #4165e6;
        overflow: hidden;
      }
      #box {
        position: absolute;
        width: 48px;
        height: 48px;
        background: #e6ff6b;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <p style="text-align: center">← / → で赤い四角が動きます</p>
    <div class="stage" id="stage">
      <div id="box"></div>
    </div>

  <script>
      const box = document.getElementById("box");

      let x = 50;          // 横の位置（状態）
      let y = 96;          // 縦の位置（状態）
      const speed = 4;     // 1回に動く量

      const keys = {};     // 押されているキーを覚える入れ物（３-３のオブジェクト）

      // 押したら true、離したら false を覚えておく（ここでは動かさない）
      document.addEventListener("keydown", (e) => {
        keys[e.code] = true;
      });
      document.addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });

      // 状態（x, y）から表示を決める
      function draw() {
        box.style.left = x + "px";
        box.style.top = y + "px";
      }

      // 一定の間隔（16ミリ秒ごと）に、押されているキーを見て動かす
      function update() {
        if (keys["ArrowRight"]) {
          x = x + speed;
        }
        if (keys["ArrowLeft"]) {
          x = x - speed;
        }
        if (keys["ArrowDown"]) {
          y = y + speed;
        }
        if (keys["ArrowUp"]) {
          y = y - speed;
        }
         if (keys["KeyD"]) {
          x = x + speed;
        }
        if (keys["KeyA"]) {
          x = x - speed;
        }
        if (keys["KeyS"]) {
          y = y + speed;
        }
        if (keys["KeyW"]) {
          y = y - speed;
        }
          if (x < 0) {
          x = 0;
        }
        if (x > 600 - 48) {
          x = 600 - 48;
        }
        // y も同じように書く
          if ( y < 0) {
          y = 0;
        }
        if (y > 240 - 48) {
          y = 240 - 48;
        }
        // y も同じように書く
        draw();
      }

      setInterval(update, 16);   // update を16ミリ秒ごとに呼ぶ（1秒に約60回）
    </script>
  </body>
</html>
